<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JD Technology | Accesorios Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* =============================================
       DISEÑO Y ANIMACIONES
       ============================================= */
    :root, [data-theme="light"] {
      --primary: #0071e3; --primary-hover: #005bb5; --negro: #1d1d1f;
      --bg: #f5f5f7; --bg-card: #ffffff; --texto: #1d1d1f; --texto-suave: #86868b;
      --borde: #d2d2d7; --sombra: 0 4px 20px rgba(0,0,0,0.05); --sombra-hover: 0 12px 30px rgba(0,0,0,0.12);
      --font-body: 'Inter', sans-serif;
    }
    [data-theme="dark"] {
      --bg: #000000; --bg-card: #1c1c1e; --texto: #f5f5f7; --texto-suave: #86868b;
      --borde: #38383a; --sombra: 0 4px 20px rgba(0,0,0,0.4); --sombra-hover: 0 12px 30px rgba(0,0,0,0.6);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
    body { background: var(--bg); font-family: var(--font-body); color: var(--texto); line-height: 1.5; overflow-x: hidden; }

    /* NUEVA ANIMACIÓN DE ENTRADA SUAVE */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    body { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* HEADER */
    header { background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); padding: 15px 5%; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    [data-theme="dark"] header { background: rgba(28,28,30,0.8); }
    .logo-block { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-accent { color: var(--primary); }
    .header-actions { display: flex; gap: 15px; align-items: center; }
    .btn-tema { background: transparent; color: var(--texto); border: none; font-size: 20px; cursor: pointer; }
    .btn-carrito-header { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-carrito-header:hover { background: var(--primary-hover); }
    #carrito-count { background: white; color: var(--primary); border-radius: 50%; padding: 2px 6px; font-size: 12px; font-weight: bold; }

    /* HERO */
    .hero { height: 300px; background: linear-gradient(to right, rgba(0,0,0,0.7), rgba(0,0,0,0.3)), url("https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?q=80&w=2070") center/cover; display: flex; align-items: center; padding: 0 5%; }
    .hero-content h2 { color: white; font-size: 38px; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }
    .hero-sub { color: #f5f5f7; font-size: 16px; }

    /* CATÁLOGO Y FILTROS */
    .container { max-width: 1200px; margin: 0 auto; padding: 50px 5%; }
    .section-title { font-size: 28px; margin-bottom: 20px; letter-spacing: -1px; }
    .filtros-wrap { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
    #buscar { padding: 12px 18px; border-radius: 12px; border: 1px solid var(--borde); background: var(--bg-card); color: var(--texto); width: 100%; max-width: 400px; font-family: inherit; }
    .filtros-categorias { display: flex; gap: 10px; flex-wrap: wrap; }
    .filtro-btn { background: var(--bg-card); color: var(--texto); border: 1px solid var(--borde); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .filtro-btn.activo, .filtro-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    /* GRILLA Y TARJETAS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
    .card { background: var(--bg-card); border-radius: 20px; padding: 20px; text-align: center; box-shadow: var(--sombra); position: relative; display: flex; flex-direction: column; transition: transform 0.3s; animation: fadeUp 0.5s ease backwards; }
    .card:hover { transform: translateY(-5px); box-shadow: var(--sombra-hover); }
    .card-img-wrap { height: 180px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; cursor: pointer; }
    .card img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.3s; }
    .card:hover img { transform: scale(1.05); }
    .card h3 { font-size: 16px; margin-bottom: 5px; }
    .card .precio { font-weight: 700; color: var(--texto); margin-bottom: 15px; font-size: 18px; }
    .card-btns { display: flex; gap: 10px; margin-top: auto; }
    .card-btns button { flex: 1; padding: 10px; border-radius: 15px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-add { background: var(--primary); color: white; }
    .btn-add:hover { background: var(--primary-hover); }
    .btn-view { background: var(--bg); color: var(--texto); border: 1px solid var(--borde); }
    
    /* MODAL DE DETALLES */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--bg-card); border-radius: 20px; max-width: 800px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; position: relative; animation: fadeUp 0.3s ease; }
    .modal-img-col { background: var(--bg); padding: 30px; display: flex; align-items: center; justify-content: center; position: relative; }
    #modal-img { max-width: 100%; max-height: 300px; object-fit: contain; }
    .modal-info-col { padding: 30px; display: flex; flex-direction: column; }
    .modal-info-col h2 { font-size: 24px; margin-bottom: 5px; }
    .modal-info-col h3 { color: var(--primary); font-size: 20px; margin-bottom: 20px; }
    .specs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .spec-line { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid var(--bg); padding-bottom: 5px; }
    .spec-line span:first-child { color: var(--texto-suave); }
    .spec-line span:last-child { font-weight: 600; }
    .close-modal { position: absolute; top: 15px; right: 15px; background: var(--bg); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; color: var(--texto); }
    
    /* CARRITO LATERAL */
    #cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 3000; }
    #cart-sidebar { position: fixed; top: 0; right: -400px; width: 100%; max-width: 350px; height: 100%; background: var(--bg-card); z-index: 3001; transition: right 0.3s; display: flex; flex-direction: column; box-shadow: -5px 0 20px rgba(0,0,0,0.1); }
    #cart-sidebar.open { right: 0; }
    .cart-header { padding: 20px; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; align-items: center; }
    .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-item { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
    .cart-item img { width: 60px; height: 60px; object-fit: contain; background: var(--bg); border-radius: 10px; padding: 5px; }
    .cart-item-info flex { flex: 1; }
    .cart-item-info h4 { font-size: 14px; }
    .cart-item-info p { color: var(--primary); font-weight: bold; font-size: 14px; }
    .qty-controls { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
    .qty-btn { border: 1px solid var(--borde); background: var(--bg); width: 25px; height: 25px; border-radius: 5px; cursor: pointer; color: var(--texto); }
    .cart-footer { padding: 20px; border-top: 1px solid var(--borde); }
    .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
    .btn-checkout { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; }

    /* TOASTS */
    #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--negro); color: white; padding: 12px 20px; border-radius: 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: fadeUp 0.3s; }
    
    @media (max-width: 768px) {
      .modal-content { grid-template-columns: 1fr; }
      .modal-img-col { height: 200px; }
      .hero-content h2 { font-size: 28px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-block">
      <span class="logo-main">JD </span><span class="logo-accent">TECHNOLOGY</span>
    </div>
    <div class="header-actions">
      <button class="btn-tema" onclick="toggleTema()">🌙</button>
      <button class="btn-carrito-header" onclick="abrirCarrito()">
        🛒 <span id="carrito-count">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h2>Ecosistema Premium</h2>
      <p class="hero-sub">Audio, protección y carga de última generación.</p>
    </div>
  </section>

  <section class="container">
    <h2 class="section-title">Catálogo</h2>
    
    <div class="filtros-wrap">
      <input type="text" id="buscar" placeholder="Buscar AirPods, cargadores..." onkeyup="filtrarProductos()">
      <div class="filtros-categorias" id="categorias">
        <button class="filtro-btn activo" onclick="filtrarCategoria('Todos', this)">Todos</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Audio', this)">Audio</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Proteccion', this)">Protección</button>
        <button class="filtro-btn" onclick="filtrarCategoria('Carga', this)">Carga</button>
      </div>
    </div>

    <div class="grid" id="grid-productos">
      </div>
  </section>

  <div id="modal" class="modal" onclick="if(event.target === this) cerrarModal()">
    <div class="modal-content">
      <button class="close-modal" onclick="cerrarModal()">✕</button>
      <div class="modal-img-col">
        <img id="modal-img" src="" alt="">
      </div>
      <div class="modal-info-col">
        <h2 id="modal-nombre">Nombre</h2>
        <h3 id="modal-precio">$0</h3>
        <div class="specs" id="modal-specs"></div>
        <button class="btn-add" id="modal-btn-add" style="padding: 15px; margin-top: auto;">🛒 Agregar al carrito</button>
      </div>
    </div>
  </div>

  <div id="cart-overlay" onclick="cerrarCarrito()"></div>
  <aside id="cart-sidebar">
    <div class="cart-header">
      <h3>Mi Carrito</h3>
      <button class="close-modal" style="position:static" onclick="cerrarCarrito()">✕</button>
    </div>
    <div class="cart-items" id="cart-items">
      </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-valor">$0</span>
      </div>
      <button class="btn-checkout" onclick="enviarWhatsApp()">Pedir por WhatsApp</button>
    </div>
  </aside>

  <div id="toast-container"></div>

  <script>
    // 1. BASE DE DATOS DE PRODUCTOS
    const productos = [
      {
        id: "airpods-4",
        nombre: "AirPods 4ta Gen",
        categoria: "Audio",
        precio: "$80.000",
        precioNum: 80000,
        img: "img/Airpods´Pro 4/audifonos-1.png", // Tu imagen local
        detalles: { Tipo: "In-Ear", Conexión: "Bluetooth 5.3", Batería: "30 Horas", Color: "Blanco" }
      },
      {
        id: "airpods-3",
        nombre: "AirPods 3ra Gen",
        categoria: "Audio",
        precio: "$60.000",
        precioNum: 60000,
        img: "img/Airpods Pro 3/3.webp",
        detalles: { Tipo: "In-Ear", Conexión: "Bluetooth 5.0", Batería: "24 Horas", Color: "Blanco" }
      },
      {
        id: "airpods-max",
        nombre: "AirPods Max",
        categoria: "Audio",
        precio: "$120.000",
        precioNum: 120000,
        img: "img/Airpods Max/Airpods Max.png",
        detalles: { Tipo: "Over-Ear", Conexión: "Bluetooth 5.0", Batería: "20 Horas", Color: "Silver" }
      },
      {
        id: "case-silicone",
        nombre: "Silicone Case iPhone",
        categoria: "Proteccion",
        precio: "$30.000",
        precioNum: 30000,
        img: "img/Case Silicone/case.jpg",
        detalles: { Material: "Silicona", Conexión: "MagSafe", Compatibilidad: "Varios Modelos", Color: "Varios" }
      },
      {
        id: "vidrio",
        nombre: "Vidrio Templado",
        categoria: "Proteccion",
        precio: "$15.000",
        precioNum: 15000,
        img: "img/Vidrio Templado/vidrio.png",
        detalles: { Tipo: "Protector 9D", Material: "Cristal Templado", Compatibilidad: "Todos los iPhone", Color: "Transparente" }
      },
      {
        id: "magsafe",
        nombre: "Cargador MagSafe",
        categoria: "Carga",
        precio: "$120.000",
        precioNum: 120000,
        img: "img/Mag Safe/Mag Ssafe.png",
        detalles: { Tipo: "Inalámbrico", Potencia: "15W", Compatibilidad: "iPhone 12+", Color: "Blanco/Plata" }
      },
      {
        id: "cubo-20w",
        nombre: "Adaptador 20W",
        categoria: "Carga",
        precio: "$25.000",
        precioNum: 25000,
        img: "img/Cubo De Carga/cubo de carga.png",
        detalles: { Tipo: "Cubo Pared", Puerto: "USB-C", Potencia: "20W", Color: "Blanco" }
      }
    ];

    let carrito = [];
    let filtroActual = "Todos";

    // 2. RENDERIZAR PRODUCTOS EN PANTALLA
    function renderizarCatálogo(lista) {
      const grid = document.getElementById("grid-productos");
      grid.innerHTML = "";

      if(lista.length === 0) {
        grid.innerHTML = "<p style='grid-column: 1/-1; color: var(--texto-suave);'>No se encontraron productos.</p>";
        return;
      }

      lista.forEach((prod, index) => {
        grid.innerHTML += `
          <div class="card" style="animation-delay: ${index * 0.05}s">
            <div class="card-img-wrap" onclick="abrirDetalles('${prod.id}')">
              <img src="${prod.img}" alt="${prod.nombre}">
            </div>
            <h3>${prod.nombre}</h3>
            <p class="precio">${prod.precio}</p>
            <div class="card-btns">
              <button class="btn-view" onclick="abrirDetalles('${prod.id}')">Ver más</button>
              <button class="btn-add" onclick="agregarAlCarrito('${prod.id}')">Agregar</button>
            </div>
          </div>
        `;
      });
    }

    // 3. FILTROS Y BÚSQUEDA
    function filtrarCategoria(cat, btn) {
      filtroActual = cat;
      // Cambiar clase activa en botones
      document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("activo"));
      btn.classList.add("activo");
      ejecutarFiltros();
    }

    function filtrarProductos() {
      ejecutarFiltros();
    }

    function ejecutarFiltros() {
      const texto = document.getElementById("buscar").value.toLowerCase();
      const filtrados = productos.filter(p => {
        const coincideCat = filtroActual === "Todos" || p.categoria === filtroActual;
        const coincideTex = p.nombre.toLowerCase().includes(texto);
        return coincideCat && coincideTex;
      });
      renderizarCatálogo(filtrados);
    }

    // 4. MODAL DE DETALLES
    function abrirDetalles(idProducto) {
      const prod = productos.find(p => p.id === idProducto);
      document.getElementById("modal-img").src = prod.img;
      document.getElementById("modal-nombre").innerText = prod.nombre;
      document.getElementById("modal-precio").innerText = prod.precio;
      
      let specsHTML = "";
      for (const [clave, valor] of Object.entries(prod.detalles)) {
        specsHTML += `<div class="spec-line"><span>${clave}</span><span>${valor}</span></div>`;
      }
      document.getElementById("modal-specs").innerHTML = specsHTML;
      
      // Actualizar el botón de agregar del modal
      const btnAddModal = document.getElementById("modal-btn-add");
      btnAddModal.onclick = () => { agregarAlCarrito(prod.id); cerrarModal(); };

      document.getElementById("modal").style.display = "flex";
    }

    function cerrarModal() {
      document.getElementById("modal").style.display = "none";
    }

    // 5. LÓGICA DEL CARRITO
    function agregarAlCarrito(idProducto) {
      const prod = productos.find(p => p.id === idProducto);
      const existe = carrito.find(item => item.id === idProducto);
      
      if (existe) {
        existe.cantidad++;
      } else {
        carrito.push({ ...prod, cantidad: 1 });
      }
      
      mostrarToast(`✅ ${prod.nombre} agregado`);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const contenedor = document.getElementById("cart-items");
      const badge = document.getElementById("carrito-count");
      const totalText = document.getElementById("cart-total-valor");
      
      contenedor.innerHTML = "";
      let total = 0;
      let cantidadTotal = 0;

      if(carrito.length === 0) {
        contenedor.innerHTML = "<p style='text-align:center; color:var(--texto-suave); margin-top: 20px;'>El carrito está vacío</p>";
      } else {
        carrito.forEach(item => {
          total += item.precioNum * item.cantidad;
          cantidadTotal += item.cantidad;
          
          contenedor.innerHTML += `
            <div class="cart-item">
              <img src="${item.img}" alt="${item.nombre}">
              <div style="flex:1">
                <h4>${item.nombre}</h4>
                <p>${item.precio}</p>
                <div class="qty-controls">
                  <button class="qty-btn" onclick="cambiarCantidad('${item.id}', -1)">-</button>
                  <span>${item.cantidad}</span>
                  <button class="qty-btn" onclick="cambiarCantidad('${item.id}', 1)">+</button>
                </div>
              </div>
            </div>
          `;
        });
      }

      badge.innerText = cantidadTotal;
      totalText.innerText = "$" + total.toLocaleString("es-CO");
    }

    function cambiarCantidad(id, delta) {
      const item = carrito.find(i => i.id === id);
      if(item) {
        item.cantidad += delta;
        if(item.cantidad <= 0) {
          carrito = carrito.filter(i => i.id !== id);
        }
        actualizarCarrito();
      }
    }

    function abrirCarrito() {
      document.getElementById("cart-sidebar").classList.add("open");
      document.getElementById("cart-overlay").style.display = "block";
    }
    
    function cerrarCarrito() {
      document.getElementById("cart-sidebar").classList.remove("open");
      document.getElementById("cart-overlay").style.display = "none";
    }

    // 6. ENVIAR PEDIDO POR WHATSAPP
    function enviarWhatsApp() {
      if(carrito.length === 0) {
        mostrarToast("⚠️ Agrega productos primero");
        return;
      }

      let mensaje = "Hola JD Technology, quiero hacer este pedido:%0A%0A";
      let total = 0;
      
      carrito.forEach(item => {
        mensaje += `- ${item.cantidad}x ${item.nombre} (${item.precio})%0A`;
        total += item.precioNum * item.cantidad;
      });
      
      mensaje += `%0A*Total: $${total.toLocaleString("es-CO")}*`;
      
      // REEMPLAZA ESTE NÚMERO POR EL TUYO
      const numeroVentas = "573116600234"; 
      window.open(`https://wa.me/${numeroVentas}?text=${mensaje}`, "_blank");
    }

    // 7. TOASTS Y TEMA
    function mostrarToast(msg) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerText = msg;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function toggleTema() {
      const html = document.documentElement;
      const temaActual = html.getAttribute("data-theme");
      html.setAttribute("data-theme", temaActual === "dark" ? "light" : "dark");
    }

    // INICIAR LA PÁGINA
    window.onload = () => {
      renderizarCatálogo(productos);
    };

  </script>
</body>
</html>
